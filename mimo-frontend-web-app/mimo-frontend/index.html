<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIMO – Self-Service Printing Kiosk</title>
    <meta name="description" content="MIMO Self-Service Printing Kiosk — fast, secure document printing via Mimo code." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1A56DB" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Warm amber background before React mounts -->
    <style>
      html, body { background: #C8860A; }
    </style>

    <!-- MIMO 1.0 (CV-001) only: Diwali background and fonts, using the same kiosk lookup order as App.tsx. -->
    <script>
      (function () {
        var kiosk = new URLSearchParams(location.search).get('kioskId');
        if (!kiosk && !/mimo-2|mimo-kiosk-app|sv-002/.test(location.hostname)) {
          try { kiosk = localStorage.getItem('mimo_kiosk_id'); } catch (e) {}
        }
        if (kiosk !== 'CV-001') return;
        var style = document.createElement('style');
        style.textContent = 'html, body { background: #FAF4E8; }';
        document.head.appendChild(style);
        var fonts = document.createElement('link');
        fonts.rel = 'stylesheet';
        fonts.href = 'https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500&family=EB+Garamond:wght@400;500;600&family=Cardo:wght@400;700&display=swap';
        document.head.appendChild(fonts);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Great+Vibes&family=Playfair+Display:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
