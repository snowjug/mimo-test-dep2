name: CI

# Checks every app that a push or pull request touches. It never deploys anything.
# Vercel builds/deploys the web apps through its own GitHub integration (checked afterwards by
# post-deploy-smoke.yml); deploy-functions.yml deploys the API; deploy-converter.yml the converter.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.f.outputs.functions }}
      website: ${{ steps.f.outputs.website }}
      kiosk: ${{ steps.f.outputs.kiosk }}
      ci: ${{ steps.f.outputs.ci }}
      converter: ${{ steps.f.outputs.converter }}
      pi: ${{ steps.f.outputs.pi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$HEAD_SHA")
          else
            files=$(git ls-files) # new branch / manual run: check everything
          fi
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          {
            echo "functions=$(has '^functions/')"
            echo "website=$(has '^mimo-website/')"
            echo "kiosk=$(has '^mimo-frontend-web-app/')"
            echo "ci=$(has '^\.github/')"
            echo "converter=$(has '^converter/')"
            echo "pi=$(has '^(pi-listener|pi_scripts)/')"
          } >> "$GITHUB_OUTPUT"
          [ "$EVENT" = "workflow_dispatch" ] && for k in functions website kiosk ci converter pi; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
          echo "Changed files: $(echo "$files" | grep -c .)"

  functions:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - name: Deployment-gate tests
        run: node --test .github/scripts/__tests__/functions-env.test.js

  website:
    name: Customer site + admin/finance build
    needs: changes
    if: needs.changes.outputs.website == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            mimo-website/package-lock.json
            mimo-website/mimo-admin-dashboard/package-lock.json
      - run: npm ci
        working-directory: mimo-website
      - name: Build (same command Vercel runs; also builds the admin app into dist/admin)
        run: npm run build
        working-directory: mimo-website
      - name: Admin bundle uses the /admin/ base path
        run: grep -q 'src="/admin/assets/' mimo-website/dist/admin/index.html

  kiosk:
    name: Kiosk UI build
    needs: changes
    if: needs.changes.outputs.kiosk == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mimo-frontend-web-app/mimo-frontend/package-lock.json
      - run: npm ci
        working-directory: mimo-frontend-web-app/mimo-frontend
      - run: npm run build
        working-directory: mimo-frontend-web-app/mimo-frontend

  converter:
    name: Converter syntax check
    needs: changes
    if: needs.changes.outputs.converter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check converter/index.js

  pi:
    name: Pi listener syntax check
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every Pi script (syntax only; the Pis are updated manually, see docs/deployment/REMAINING_SETUP.md)
        run: python -m compileall -q pi-listener pi_scripts

  workflows:
    name: Lint GitHub workflows
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
