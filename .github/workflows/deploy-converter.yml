name: Deploy Cloud Run Office Converter

# Runs when the converter's own files change on main (or manually). Nothing else triggers it.
on:
  push:
    branches:
      - main
    paths:
      - "converter/**"
  workflow_dispatch:

concurrency:
  group: deploy-converter
  cancel-in-progress: false

jobs:
  deploy-converter:
    name: Build & Deploy Converter to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Container via Cloud Build
        run: |
          gcloud builds submit converter \
            --tag=gcr.io/mimo-v2-11868/mimo-office-converter:latest \
            --project=mimo-v2-11868

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mimo-office-converter \
            --image=gcr.io/mimo-v2-11868/mimo-office-converter:latest \
            --region=us-central1 \
            --platform=managed \
            --port=8080 \
            --memory=2Gi \
            --cpu=1 \
            --timeout=120s \
            --concurrency=10 \
            --min-instances=0 \
            --max-instances=5 \
            --no-allow-unauthenticated \
            --update-env-vars="STORAGE_BUCKET=mimo-v2-11868.firebasestorage.app" \
            --project=mimo-v2-11868 \
            --quiet

      - name: Grant Cloud Run Invoker to Functions Runtime
        run: |
          gcloud run services add-iam-policy-binding mimo-office-converter \
            --region=us-central1 \
            --member="serviceAccount:144514765704-compute@developer.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --project=mimo-v2-11868 \
            --quiet

      - name: Verify Service Endpoint URL
        run: |
          SERVICE_URL=$(gcloud run services describe mimo-office-converter \
            --region=us-central1 \
            --project=mimo-v2-11868 \
            --format="value(status.url)")
          echo "Cloud Run Service deployed at: $SERVICE_URL"
