name: Deploy Firebase Functions

# Everything Firebase-side deploys from a push to main:
#   - `rules`  job: Firestore + Storage security rules (firebase/*.rules). Independent of the API gate below, so a
#                rules fix can never be held back by a failing API deploy. (Rules used to be deployed by hand and
#                had drifted: production still allowed public write to pricing and to /uploads.)
#   - `deploy` job: the production API (`functions:api`), then the 6 Firestore/scheduler triggers when trigger code
#                (or code they share) changed. The trigger regions are pinned in code and by
#                functions/__tests__/triggerDeployment.test.js, so this updates the live copies instead of creating
#                duplicates. A trigger failure turns the run red but leaves the healthy API in place.
# Firestore indexes are NOT deployed here: `firebase deploy` would offer to delete indexes missing from the file.
# Environment variables are NOT in git. They come from (1) the live function's current configuration and
# (2) the optional FUNCTIONS_ENV_FILE repository secret. The deploy stops before touching production when
# required configuration is missing or insecure (default admin password, weak/public JWT secret).
on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
      - ".github/scripts/functions-env.js"
  workflow_dispatch:
    inputs:
      ref:
        description: "Rollback: an older commit or tag of main to redeploy (empty = latest main). Must already be part of main."
        type: string
        default: ""
      deploy_triggers:
        description: "Force-deploy the 6 Firestore/scheduler triggers (a push deploys them automatically only when trigger code changed)"
        type: boolean
        default: false
      deploy_print_timeout_sweep:
        description: "Also deploy scheduledPrintTimeoutSweep (new, us-central1, no region-mismatch risk — safe to run standalone)"
        type: boolean
        default: false

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: mimo-v2-11868
  REGION: us-central1
  API_URL: https://api-upqxuj7evq-uc.a.run.app

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Unit tests
        working-directory: functions
        run: npm test
      - name: Deployment-gate tests
        run: node --test .github/scripts/__tests__/functions-env.test.js

  rules:
    name: Deploy Firestore and Storage rules
    needs: test
    # Production deploys come from main only; a rollback run (explicit ref) only concerns the API.
    if: github.ref == 'refs/heads/main' && inputs.ref == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore and Storage rules
        run: firebase deploy --only "firestore:rules,storage" --project "$PROJECT_ID"

  deploy:
    name: Deploy to Firebase
    needs: test
    # Production deploys come from main only (manual runs from other branches are refused).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Refuse refs that are not part of main
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$TARGET_REF" ]; then
            git fetch --quiet origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "::error title=Rollback refused::$TARGET_REF is not part of main"; exit 1; }
            echo "Rolling back to $(git rev-parse --short HEAD)"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Read the live function's environment (read-only)
        run: |
          if gcloud run services describe api --region="$REGION" --project="$PROJECT_ID" --format=json > "$RUNNER_TEMP/live-service.json" 2>/dev/null; then
            echo "Read the deployed function's configuration."
          else
            echo "::warning::Could not read the deployed function's configuration; relying on the FUNCTIONS_ENV_FILE secret only."
            echo '{}' > "$RUNNER_TEMP/live-service.json"
          fi

      - name: Prepare functions/.env and run the security gate
        env:
          LIVE_ENV_JSON_PATH: ${{ runner.temp }}/live-service.json
          FUNCTIONS_ENV_FILE: ${{ secrets.FUNCTIONS_ENV_FILE }}
        run: node .github/scripts/functions-env.js functions/.env

      - name: Deploy API
        env:
          FIREBASE_FUNCTIONS_DISCOVERY_TIMEOUT: "60000"
        run: firebase deploy --only "functions:api" --force --project "$PROJECT_ID"

      - name: Ensure public invoker access
        run: |
          gcloud run services add-iam-policy-binding api \
            --region="$REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Smoke test the deployed API
        run: |
          check() { # name, expected status, curl args...
            local name="$1" want="$2"; shift 2
            for _ in 1 2 3 4 5 6; do
              got=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$@" || true)
              [ "$got" = "$want" ] && { echo "OK   $name -> $got"; return 0; }
              sleep 10
            done
            echo "::error title=Smoke test failed::$name returned $got, expected $want"
            return 1
          }
          check "API is up (GET /)" 200 "$API_URL/"
          check "New admin endpoints deployed (GET /admin/analytics without token)" 401 "$API_URL/admin/analytics"
          check "Admin login rejects bad credentials" 401 -X POST -H "content-type: application/json" \
            -d '{"email":"ci-smoke-test","password":"not-a-real-password"}' "$API_URL/admin/login"

      # The triggers import shared services/config/utils, so those count as trigger code. If the previous commit is
      # not in this checkout (history was rewritten) assume changed: redeploying unchanged functions is harmless.
      - name: Did trigger code change?
        id: triggers
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=false
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^functions/(src/(triggers|services|config|utils)/|index\.js|package(-lock)?\.json)'; then
            changed=true
          fi
          echo "Trigger code changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Runs only after the API is deployed and verified, so a trigger problem can never take the API down.
      # A failure here turns the run red but leaves the healthy API in place.
      - name: Deploy Firestore/scheduler triggers
        if: inputs.deploy_triggers || steps.triggers.outputs.changed == 'true'
        env:
          FIREBASE_FUNCTIONS_DISCOVERY_TIMEOUT: "60000"
        run: |
          TRIGGERS="autoRefundJob autoCleanupStorageJob sendFailureNotification printerHardwareNotification colourPaperUsageNotification scheduledFileRetentionCleanup"
          TARGETS=$(for t in $TRIGGERS; do printf "functions:%s," "$t"; done)
          firebase deploy --only "${TARGETS%,}" --force --project "$PROJECT_ID"

      # Isolated on purpose: scheduledPrintTimeoutSweep is new and has no explicit region (defaults to
      # us-central1, same as scheduledFileRetentionCleanup), so unlike the bulk trigger deploy above it
      # carries no risk of creating a duplicate copy in the wrong region.
      - name: Deploy scheduledPrintTimeoutSweep
        if: inputs.deploy_print_timeout_sweep
        env:
          FIREBASE_FUNCTIONS_DISCOVERY_TIMEOUT: "60000"
        run: firebase deploy --only "functions:scheduledPrintTimeoutSweep" --force --project "$PROJECT_ID"

      - name: Remove generated .env
        if: always()
        run: rm -f functions/.env "$RUNNER_TEMP/live-service.json"
