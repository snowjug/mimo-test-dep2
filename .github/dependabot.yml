# Weekly, grouped, and capped so that updates never flood the pull-request list.
# Security updates are handled separately by GitHub and are not limited by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    labels: [dependencies, backend]
  - package-ecosystem: npm
    directory: /converter
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /mimo-website
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    labels: [dependencies, frontend]
  - package-ecosystem: npm
    directory: /mimo-website/mimo-admin-dashboard
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    labels: [dependencies, frontend]
  - package-ecosystem: npm
    directory: /mimo-frontend-web-app/mimo-frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    labels: [dependencies, frontend]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
